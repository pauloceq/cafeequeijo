name: Publicar no GitHub Pages

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Descobrir as chaves do Supabase
        env:
          URL_VAR: ${{ vars.VITE_SUPABASE_URL }}
          KEY_VAR: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # 1) Variables do repositório, se existirem; 2) senão, busca pela API do Supabase
          if [ -n "$URL_VAR" ] && [ -n "$KEY_VAR" ]; then
            echo "VITE_SUPABASE_URL=$URL_VAR" >> "$GITHUB_ENV"
            echo "VITE_SUPABASE_ANON_KEY=$KEY_VAR" >> "$GITHUB_ENV"
          elif [ -n "$TOKEN" ] && [ -n "$REF" ]; then
            REF=$(echo "$REF" | sed -E 's#https?://##; s#\.supabase\.co.*##; s#/.*##')
            CHAVE=$(curl -sS "https://api.supabase.com/v1/projects/$REF/api-keys" -H "Authorization: Bearer $TOKEN" \
              | jq -r '([.[] | select(.type == "publishable")][0].api_key) // ([.[] | select(.name == "anon")][0].api_key) // empty')
            if [ -z "$CHAVE" ]; then echo "::warning::Não consegui ler a chave pública do Supabase; o app vai pedir na primeira tela."; exit 0; fi
            echo "::add-mask::$CHAVE"
            echo "VITE_SUPABASE_URL=https://$REF.supabase.co" >> "$GITHUB_ENV"
            echo "VITE_SUPABASE_ANON_KEY=$CHAVE" >> "$GITHUB_ENV"
            echo "Chaves obtidas do projeto $REF."
          else
            echo "::warning::Sem chaves do Supabase: o app vai pedir URL e chave na primeira tela."
          fi
      - name: Gerar o site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
