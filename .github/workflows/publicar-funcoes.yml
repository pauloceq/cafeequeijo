name: Publicar funções do Supabase

# Só é necessário para a conexão direta com o Mercado Livre.
# Cadastre em Settings > Secrets and variables > Actions > aba "Secrets":
#   SUPABASE_ACCESS_TOKEN  (Supabase > Account > Access Tokens)
#   SUPABASE_PROJECT_REF   (o "xxxx" de https://xxxx.supabase.co)
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'claude/**']
    paths: ['supabase/functions/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir segredos
        id: conferir
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Cadastre os segredos SUPABASE_ACCESS_TOKEN e SUPABASE_PROJECT_REF para publicar as funções (veja o README)."
            echo "pular=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.conferir.outputs.pular != '1'
        with:
          version: latest
      - name: Publicar
        if: steps.conferir.outputs.pular != '1'
        run: |
          supabase functions deploy conexoes --project-ref "$PROJECT_REF"
          supabase functions deploy oauth-callback --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy ml-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy sync-agendado --project-ref "$PROJECT_REF" --no-verify-jwt
